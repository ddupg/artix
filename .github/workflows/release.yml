name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: artix-x86_64-unknown-linux-gnu.tar.gz
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: artix-x86_64-apple-darwin.tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: artix-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run tests
        run: cargo test --all-targets --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.archive }} artix
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artix-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  update-homebrew-tap:
    name: update homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Dispatch tap update
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DDUPG_DISPATCH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_DDUPG_DISPATCH_TOKEN is required to update ddupg/homebrew-ddupg"
            exit 1
          fi

          dispatch_id="artix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version="${TAG_NAME#v}"

          payload="$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg version "$version" \
            --arg source_repo "$SOURCE_REPO" \
            --arg dispatch_id "$dispatch_id" \
            '{
              event_type: "artix_release_published",
              client_payload: {
                tag_name: $tag_name,
                version: $version,
                source_repo: $source_repo,
                dispatch_id: $dispatch_id
              }
            }')"

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            /repos/ddupg/homebrew-ddupg/dispatches \
            --input - <<<"$payload"

          echo "dispatch_id=$dispatch_id" >> "$GITHUB_OUTPUT"

      - name: Wait for tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DDUPG_DISPATCH_TOKEN }}
          DISPATCH_ID: ${{ steps.dispatch.outputs.dispatch_id }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1200))
          run_url=""

          while [ "$SECONDS" -lt "$deadline" ]; do
            run_row="$(gh api \
              --header "Accept: application/vnd.github+json" \
              "/repos/ddupg/homebrew-ddupg/actions/workflows/update-artix.yml/runs?event=repository_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.display_title | contains(\"$DISPATCH_ID\"))][0] | if . == null then \"\" else [.id, .status, (.conclusion // \"\"), .html_url] | @tsv end")"

            if [ -n "$run_row" ]; then
              IFS=$'\t' read -r run_id status conclusion run_url <<<"$run_row"
              echo "tap update run: $run_url ($status ${conclusion:-pending})"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi

                echo "::error::homebrew-ddupg update failed with conclusion: $conclusion"
                exit 1
              fi
            else
              echo "waiting for homebrew-ddupg workflow run for dispatch $DISPATCH_ID"
            fi

            sleep 10
          done

          if [ -n "$run_url" ]; then
            echo "::error::Timed out waiting for homebrew-ddupg update: $run_url"
          else
            echo "::error::Timed out waiting for homebrew-ddupg workflow run to start"
          fi
          exit 1
