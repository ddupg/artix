[package]
name = "artix"
version = "0.3.0"
edition = "2024"
rust-version = "1.96.0"

[dependencies]
crossterm = "0.29.0"
directories = "6"
gix = { version = "0.81.0", features = ["excludes"] }
gengo = { version = "0.14.3", default-features = false, features = ["directory", "max-performance-safe"] }
ignore = "0.4.25"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
toml = "0.9"
trash = "5"

[dev-dependencies]
tempfile = "3"
